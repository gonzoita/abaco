name: CI - lint, pruebas y compilar frontend

# Corre en dos momentos:
#  - En cada pull request hacia main: lint, pruebas y compilación. Es la
#    compuerta que decide si un cambio puede mezclarse (y, al mezclarse,
#    desplegarse: el webhook de GitHub publica cada push a main). No
#    commitea nada.
#  - En cada push a main: lo mismo y, además, commitea el frontend
#    recompilado. Ese commit incluye "[skip ci]", así que GitHub no vuelve a
#    disparar este workflow para él (evita loop).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# Un push nuevo a un PR cancela la corrida anterior de ese PR. En main nunca
# se cancela: interrumpir el commit del build dejaría el frontend a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verificar sintaxis de todos los .php
        run: |
          set -e
          err=0
          while IFS= read -r -d '' file; do
            php -l "$file" || err=1
          done < <(find . -name '*.php' -not -path './frontend/node_modules/*' -print0)
          if [ "$err" -ne 0 ]; then
            echo "::error::Hay archivos PHP con errores de sintaxis. Revisa el log de arriba."
            exit 1
          fi
          echo "PHP OK - sin errores de sintaxis."

      - name: Instalar dependencias de Composer (solo para correr las pruebas)
        run: composer install --no-interaction --prefer-dist

      - name: Pruebas del backend (PHPUnit)
        run: vendor/bin/phpunit

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Pruebas del frontend (Vitest)
        working-directory: frontend
        run: npm test

      - name: Limpiar builds anteriores (assets/*.js, assets/*.css)
        run: rm -f assets/*.js assets/*.css

      - name: Compilar frontend (vite build -> raíz del repo)
        working-directory: frontend
        run: npm run build

      - name: Commitear el build si cambió algo
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "Sin cambios en el build, no se commitea nada."
          else
            git commit -m "build: recompilar frontend automáticamente [skip ci]"
            git push
          fi

name: CI - lint, pruebas y compilar frontend

# Corre en cada pull request hacia main y en cada push a main: lint de PHP,
# pruebas y compilación. Es la compuerta que decide si un cambio puede
# mezclarse (y, al mezclarse, desplegarse: el webhook de GitHub publica cada
# push a main).
#
# NO escribe en main. El frontend compilado (index.html y assets/) vive en el
# repo porque el hosting sirve el repo tal cual y no tiene Node, así que se
# commitea en el MISMO pull request que cambia el código, y este workflow
# solo verifica que esté al día. Antes un paso final lo commiteaba desde aquí
# después de mezclar, pero la regla de main que exige el chequeo "build"
# rechaza ese push (GH013), y el sitio se quedaba con el frontend viejo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela la corrida anterior de ese PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verificar sintaxis de todos los .php
        run: |
          set -e
          err=0
          while IFS= read -r -d '' file; do
            php -l "$file" || err=1
          done < <(find . -name '*.php' -not -path './frontend/node_modules/*' -print0)
          if [ "$err" -ne 0 ]; then
            echo "::error::Hay archivos PHP con errores de sintaxis. Revisa el log de arriba."
            exit 1
          fi
          echo "PHP OK - sin errores de sintaxis."

      - name: Instalar dependencias de Composer (solo para correr las pruebas)
        run: composer install --no-interaction --prefer-dist

      - name: Pruebas del backend (PHPUnit)
        run: vendor/bin/phpunit

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Pruebas del frontend (Vitest)
        working-directory: frontend
        run: npm test

      - name: Limpiar builds anteriores (assets/*.js, assets/*.css)
        run: rm -f assets/*.js assets/*.css

      - name: Compilar frontend (vite build -> raíz del repo)
        working-directory: frontend
        run: npm run build

      - name: Verificar que el frontend compilado del repo está al día
        run: |
          git add -A index.html assets/
          if git diff --cached --quiet; then
            echo "El frontend compilado coincide con el código fuente."
          else
            echo "::error::El frontend compilado (index.html y assets/) no coincide con el código fuente. Corre 'cd frontend && npm run build' y commitea el resultado en este mismo PR."
            git diff --cached --stat
            exit 1
          fi

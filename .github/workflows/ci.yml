name: CI - lint, pruebas y compilar frontend

# Se dispara en cada push a main. El commit que este workflow hace al final
# (con el frontend recompilado) incluye "[skip ci]" en el mensaje, así que
# GitHub no vuelve a disparar este mismo workflow para ese commit (evita loop).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verificar sintaxis de todos los .php
        run: |
          set -e
          err=0
          while IFS= read -r -d '' file; do
            php -l "$file" || err=1
          done < <(find . -name '*.php' -not -path './frontend/node_modules/*' -print0)
          if [ "$err" -ne 0 ]; then
            echo "::error::Hay archivos PHP con errores de sintaxis. Revisa el log de arriba."
            exit 1
          fi
          echo "PHP OK - sin errores de sintaxis."

      - name: Instalar dependencias de Composer (solo para correr las pruebas)
        run: composer install --no-interaction --prefer-dist

      - name: Pruebas del backend (PHPUnit)
        run: vendor/bin/phpunit

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Pruebas del frontend (Vitest)
        working-directory: frontend
        run: npm test

      - name: Limpiar builds anteriores (assets/*.js, assets/*.css)
        run: rm -f assets/*.js assets/*.css

      - name: Compilar frontend (vite build -> raíz del repo)
        working-directory: frontend
        run: npm run build

      - name: Commitear el build si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "Sin cambios en el build, no se commitea nada."
          else
            git commit -m "build: recompilar frontend automáticamente [skip ci]"
            git push
          fi

      - name: Disparar deploy en el servidor
        # Dispara deploy.php directo desde este job, sin depender del webhook
        # nativo de GitHub (Settings > Webhooks) ni de que alguien lo corra a
        # mano. Requiere el secret DEPLOY_WEBHOOK_SECRET en este repo
        # (Settings > Secrets and variables > Actions), con el mismo valor
        # que GITHUB_WEBHOOK_SECRET en el .env del servidor -- ver README,
        # sección Deploy. Si ya existe un webhook nativo apuntando a
        # deploy.php, este paso lo duplica sin problema: deploy.php es
        # idempotente (git reset --hard, rsync --delete, migración con
        # registro en schema_migrations).
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "DEPLOY_WEBHOOK_SECRET no está configurado como secret de Actions; se omite el deploy automático."
            exit 0
          fi
          payload='{"ref":"refs/heads/main","triggered_by":"github-actions"}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | sed 's/^.* //')"
          http_code=$(curl -sS -o deploy_response.txt -w '%{http_code}' \
            -X POST "https://abaco.briela.app/deploy.php" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            -d "$payload")
          echo "=== Respuesta de deploy.php (HTTP $http_code) ==="
          cat deploy_response.txt
          if [ "$http_code" != "200" ]; then
            echo "::error::deploy.php respondió HTTP $http_code"
            exit 1
          fi

name: CI - lint PHP y compilar frontend

# Se dispara en cada push a main. El commit que este workflow hace al final
# (con el frontend recompilado) incluye "[skip ci]" en el mensaje, así que
# GitHub no vuelve a disparar este mismo workflow para ese commit (evita loop).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Verificar sintaxis de todos los .php
        run: |
          set -e
          err=0
          while IFS= read -r -d '' file; do
            php -l "$file" || err=1
          done < <(find . -name '*.php' -not -path './frontend/node_modules/*' -print0)
          if [ "$err" -ne 0 ]; then
            echo "::error::Hay archivos PHP con errores de sintaxis. Revisa el log de arriba."
            exit 1
          fi
          echo "PHP OK - sin errores de sintaxis."

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Limpiar builds anteriores (assets/*.js, assets/*.css)
        run: rm -f assets/*.js assets/*.css

      - name: Compilar frontend (vite build -> raíz del repo)
        working-directory: frontend
        run: npm run build

      - name: Commitear el build si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "Sin cambios en el build, no se commitea nada."
          else
            git commit -m "build: recompilar frontend automáticamente [skip ci]"
            git push
          fi
